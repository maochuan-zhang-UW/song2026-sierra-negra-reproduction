pos1-frequency     =l1+l2
pos1-soltype       =combined
pos1-elmask        =15
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =off
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =1
pos2-armode        =continuous
pos2-arthres       =3
out-solformat      =enu
out-timesys        =utc
out-timeform       =hms
out-outhead        =on
out-outopt         =on
ant2-postype       =rinexhead
